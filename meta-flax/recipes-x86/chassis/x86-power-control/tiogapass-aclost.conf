# Force x86-power-control to apply the configured power-restore policy on
# every BMC boot.  bmcBootCheck() in power_control.cpp short-circuits the
# whole policy when /tmp/ACLost is absent; on TiogaPass we have no AC-loss
# detector wired up, and state.json already records the last user-intended
# host power state, so unconditionally creating this marker is safe:
#   - host running + warm BMC reboot: PS_PWROK high -> policy skipped
#   - host off + last state On (AC loss): policy=Restore powers host on
#   - host off + last state Off: policy=Restore re-applies Off (no-op)
f /tmp/ACLost 0644 root root -
