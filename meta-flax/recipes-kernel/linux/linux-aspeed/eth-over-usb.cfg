# USB Ethernet gadget (CDC-ECM + RNDIS) for the BMC<->host internal virtual NIC.
# The AST2500 usb-vhub (device/peripheral controller) and the configfs gadget
# framework are already enabled (they drive the obmc-ikvm HID gadget); these add
# the ethernet function drivers so a virtual NIC can be presented to the host OS
# for in-band Redfish access (firmware update, etc.).
CONFIG_USB_U_ETHER=y
CONFIG_USB_F_ECM=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_F_RNDIS=y
CONFIG_USB_CONFIGFS_RNDIS=y
