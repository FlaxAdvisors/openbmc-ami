# PECI core + ASPEED controller (not set by the meta-aspeed 257-line defconfig fragment)
CONFIG_PECI=y
CONFIG_PECI_ASPEED=y
CONFIG_PECI_CPU=y
# PECI CPU/DIMM temperature sensors (hwmon drivers)
CONFIG_SENSORS_PECI_CPUTEMP=y
CONFIG_SENSORS_PECI_DIMMTEMP=y
# I2C slave support
CONFIG_I2C_SLAVE=y
# Use hardware MAC for bmc
CONFIG_NCSI_OEM_CMD_GET_MAC=y 
CONFIG_IPMB_DEVICE_INTERFACE=y
CONFIG_SENSORS_PXE1610=y
CONFIG_SENSORS_INA2XX=y 
