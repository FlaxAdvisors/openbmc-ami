# nscd.conf for TiogaPass BMC
# Minimal memory footprint: shared=no prevents pre-allocated shared memory
# segments (default 32MB each).  Cache stays in nscd's own heap, bounded
# by max-db-size.  persistent=no avoids memory-mapped files in /var/db/nscd.

	threads			2
	max-threads		4
	paranoia		no

	enable-cache		passwd		yes
	positive-time-to-live	passwd		600
	negative-time-to-live	passwd		20
	suggested-size		passwd		211
	check-files		passwd		yes
	persistent		passwd		no
	shared			passwd		no
	max-db-size		passwd		2097152
	auto-propagate		passwd		yes

	enable-cache		group		yes
	positive-time-to-live	group		3600
	negative-time-to-live	group		60
	suggested-size		group		211
	check-files		group		yes
	persistent		group		no
	shared			group		no
	max-db-size		group		2097152
	auto-propagate		group		yes

	enable-cache		hosts		no
	shared			hosts		no
	persistent		hosts		no
	max-db-size		hosts		524288

	enable-cache		services	no
	shared			services	no
	persistent		services	no
	max-db-size		services	524288

	enable-cache		netgroup	no
	shared			netgroup	no
	persistent		netgroup	no
	max-db-size		netgroup	524288
