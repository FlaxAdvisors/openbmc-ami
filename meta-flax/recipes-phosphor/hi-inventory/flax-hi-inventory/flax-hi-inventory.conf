# Make sure the stamp file the .path unit watches exists before the unit
# starts; systemd would otherwise fall back to watching whichever ancestor
# directory happens to exist on a freshly erased rwfs.
d /var/lib/flax-inventory 0755 root root -
d /var/lib/flax-inventory/collections 0755 root root -
f /var/lib/flax-inventory/collections/.updated 0644 root root -
